<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./calc.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container main-wrapper">
        <div class="row calculator g-0">


            <div class="col-md-6 left-panel p-4">
                <h1 class="form-title mb-4">Calculadora Hipotecaria</h1>

            <form id="hipoteca">

                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold">Monto</label>
                    <div class="input-group">
                        <input id="monto" type="number" class="form-control">
                        <span class="input-group-text">$</span>
                    </div>
                </div>

                <div class="mb-4">
                        <label class="form-label text-secondary small fw-bold">Plazo</label>
                        <div class="input-group">
                            <input id="plazo" type="number" class="form-control">
                            <span class="input-group-text">Años</span>
                        </div>
                </div>

                <div class="mb-4">
                        <label class="form-label text-secondary small fw-bold">Interés</label>
                        <div class="input-group">
                            <input id="interes" type="number" class="form-control">
                            <span class="input-group-text">%</span>
                        </div>
                    </div>

                <div class="mb-4">
                    <label class="form-label text-secondary small fw-bold">Tipo</label>

                    <select id="tipo" class="form-select">
                        <option value="pago-completo">Repayment</option>
                        <option value="interes">Intereses</option>
                    </select>
                </div>
                
                <button class="calc btn btn-success w-100" type="submit">Calcular</button>
            </form>
        </div>

        <div class="col-md-6 right-panel resultados">
            <div class="results p-4 border rounded">
            <h5>Resultados</h5>
            <p class ="small-text">
                Los resultados se mostraran aquí
            </p>

                <div class="result-highlight">
                    <p>Repayment Mensual</p>
                    <h2 id="result-mens">$0.00</h2>

                    <hr style="border-color: rgba(255, 255, 255, 0.2);">
                    
                    <p>Total</p>
                    <strong id="result-total">Resultado Total</strong>

                </div>
            </div>
        </div>
    </div>
<script src="./calc.js"></script>
</body>
</html>
